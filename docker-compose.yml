# ==============================================================================
# PrepMaster Production Docker Compose Orchestration
# Hardened, Isolated Multi-Tier Architecture with Reverse Proxy & DDoS Shield
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PrepMaster Application Server (FastAPI / Uvicorn)
  # Isolated in backend_net, non-root user, no direct public port exposure
  # ----------------------------------------------------------------------------
  prepmaster-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prepmaster_platform
    restart: unless-stopped
    expose:
      - "8050"
    environment:
      - PORT=8050
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - PREPMASTER_DB_PATH=/app/data/prepmaster.db
      - SECRET_KEY=${SECRET_KEY:-prepmaster_secure_jwt_secret_change_in_production_2026}
    volumes:
      - prepmaster_data:/app/data
      - ./static/audio:/app/static/audio:ro
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/api/student/status')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Nginx Reverse Proxy & Edge Shield
  # TLS Termination, Rate Limiting, High-Speed Static Caching & Proxy Sanitization
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: prepmaster_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/cloudflare_ips.conf:/etc/nginx/cloudflare_ips.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/var/www/static:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - backend_net
    depends_on:
      prepmaster-app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Fail2ban DDoS & Abuse Mitigation Template
  # Scans Nginx logs to dynamically block malicious IPs and brute-force actors
  # ----------------------------------------------------------------------------
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: prepmaster_fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=Europe/Istanbul
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - ./docker/fail2ban/jail.d:/etc/fail2ban/jail.d:ro
      - ./docker/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - fail2ban_data:/data
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------------------------
# Isolated Bridge Networks
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
    name: prepmaster_frontend_net
  backend_net:
    driver: bridge
    name: prepmaster_backend_net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  prepmaster_data:
    name: prepmaster_data
    driver: local
  nginx_logs:
    name: prepmaster_nginx_logs
    driver: local
  fail2ban_data:
    name: prepmaster_fail2ban_data
    driver: local
