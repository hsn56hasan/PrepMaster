<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ödeme sonucu — PrepKampüs</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #eef8f3; color: #0f172a;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .kart { max-width: 360px; padding: 24px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 16px; }
    a { color: #047857; font-weight: 600; }
  </style>
</head>
<body>
  <div class="kart">
    <h1 id="baslik">Ödeme işleniyor…</h1>
    <p id="metin">Lütfen bekleyin.</p>
    <a id="geri" href="/">PrepKampüs'e dön</a>
  </div>
  <script>
    // PayTR, ödeme bitince bu sayfayı kendi penceresinin içinde açar.
    // Buradaki "başarılı" bilgisi KİLİDİ AÇMAZ: kilit yalnızca PayTR'nin sunucuya gönderdiği
    // imzalı bildirimle açılır; ana sayfa sipariş durumunu sunucudan sorar.
    var durum = new URLSearchParams(location.search).get("durum") === "basarili" ? "basarili" : "basarisiz";
    document.getElementById("baslik").textContent =
      durum === "basarili" ? "Ödemeniz alındı" : "Ödeme tamamlanamadı";
    document.getElementById("metin").textContent =
      durum === "basarili" ? "Paketiniz birkaç saniye içinde açılacak." : "Kartınızdan para çekilmedi. Tekrar deneyebilirsiniz.";

    var cerceveIcinde = false;
    try { cerceveIcinde = window.top !== window.self; } catch (e) { cerceveIcinde = true; }
    if (cerceveIcinde) {
      try { window.top.postMessage({ kaynak: "prepmaster-odeme", durum: durum }, location.origin); } catch (e) {}
      document.getElementById("geri").style.display = "none";
    } else {
      // Pencere dışında açıldıysa ana sayfaya dön; orası sipariş durumunu kontrol eder.
      setTimeout(function () { location.replace("/?odeme=" + durum); }, 1500);
    }
  </script>
</body>
</html>
