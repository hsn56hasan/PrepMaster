# ==============================================================================
# PrepMaster Production Virtual Host Configuration
# Dual Stack (HTTP/HTTPS), Rate Limiting, SSL Hardening, Static Caching & Proxy
# ==============================================================================

# Map for WebSocket Upgrade header handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80): ACME Validation & Enforced HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prepmaster.local prepmaster.edu.tr _;

    # Let's Encrypt / Certbot Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all plain HTTP requests to HTTPS with 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443): Hardened Production Endpoint
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prepmaster.local prepmaster.edu.tr _;

    # --------------------------------------------------------------------------
    # SSL/TLS Certificate Configuration (Cloudflare Origin CA or Let's Encrypt)
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/prepmaster.crt;
    ssl_certificate_key /etc/nginx/ssl/prepmaster.key;

    # --------------------------------------------------------------------------
    # Modern TLS Security Posture (A+ Rating on SSL Labs)
    # --------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k; # Minimizes TTFB latency

    # --------------------------------------------------------------------------
    # Production Security Response Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self' blob: data:; connect-src 'self' ws: wss:;" always;

    # Limit active concurrent TCP connections per IP to mitigate Slowloris / DoS
    limit_conn addr_conn_limit 25;

    # --------------------------------------------------------------------------
    # Malicious Scanner & Exploit Bot Filtering
    # --------------------------------------------------------------------------
    if ($http_user_agent ~* (sqlmap|nikto|masscan|zgrab|nmap|acunetix|havij|nessus|dirbuster|gobuster|wpscan)) {
        return 403;
    }

    # Deny access to sensitive hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Static Assets & Academic Audio Streaming Caching (Direct Nginx High-Speed Serving)
    # --------------------------------------------------------------------------
    # Academic MP3 Audio Files (Listening tracks: track_1..8.mp3, lis_*.mp3)
    location /static/audio/ {
        alias /var/www/static/audio/;
        expires 90d;
        add_header Cache-Control "public, max-age=7776000, immutable";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
        sendfile on;
        sendfile_max_chunk 512k;
        tcp_nopush on;
        tcp_nodelay on;
        limit_req zone=static_assets burst=30 nodelay;
        try_files $uri =404;
    }

    # General Static Frontend Assets (CSS, JS, Fonts, Icons)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        limit_req zone=static_assets burst=50 nodelay;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Sensitive API Endpoints (OTP Request, Verification, Login & Registration)
    # Strict rate limit (3 req/s, burst=5) to prevent brute-force attacks
    # --------------------------------------------------------------------------
    location ~ ^/api/student/(request-otp|verify-otp|verify) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://prepmaster_backend;
        include /etc/nginx/proxy_params;
    }

    location ~ ^/api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://prepmaster_backend;
        include /etc/nginx/proxy_params;
    }

    # --------------------------------------------------------------------------
    # General API Endpoints (/api/universities, /api/questions, /api/exam, etc.)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://prepmaster_backend;
        include /etc/nginx/proxy_params;
    }

    # --------------------------------------------------------------------------
    # Application Root & SPA Routing (/ and /index.html)
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://prepmaster_backend;
        include /etc/nginx/proxy_params;
    }

    # Custom Error Pages
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "İstek limiti aşıldı. Lütfen birkaç saniye sonra tekrar deneyiniz.", "status": 429}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error": "Service Temporarily Unavailable", "message": "Sunucu şu anda meşgul veya bakım modunda. Lütfen birazdan tekrar deneyiniz.", "status": 503}';
    }
}
