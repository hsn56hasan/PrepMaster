# ==============================================================================
# PrepMaster Production Nginx Main Configuration
# High-Performance, DDoS-Resistant, Hardened Reverse Proxy
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging Configuration (Cloudflare Real-IP Aware)
    # --------------------------------------------------------------------------
    log_format cf_combined '$http_cf_connecting_ip - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'cf_ray="$http_cf_ray" country="$http_cf_ipcountry"';

    log_format json_analytics escape=json
      '{"time_local":"$time_local",'
      '"client_ip":"$http_cf_connecting_ip",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"cf_ray":"$http_cf_ray"}';

    access_log  /var/log/nginx/access.log  cf_combined;

    # --------------------------------------------------------------------------
    # Real-IP Restoration from Cloudflare Edge
    # --------------------------------------------------------------------------
    include /etc/nginx/cloudflare_ips.conf;

    # --------------------------------------------------------------------------
    # Performance & OS System Call Optimizations
    # --------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    server_tokens   off;

    # --------------------------------------------------------------------------
    # Buffer Overflow & Slowloris Attack Mitigations
    # --------------------------------------------------------------------------
    client_body_buffer_size      128k;
    client_max_body_size          25M;   # Accommodates voice recording uploads
    client_header_buffer_size     2k;
    large_client_header_buffers 4 8k;
    client_body_timeout           15s;
    client_header_timeout         15s;
    send_timeout                  15s;

    # --------------------------------------------------------------------------
    # Gzip Compression for Optimal Latency and Bandwidth
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        font/otf
        font/ttf;
    gzip_disable "msie6";

    # --------------------------------------------------------------------------
    # Rate Limiting & Concurrent Connection Zones
    # --------------------------------------------------------------------------
    # General API endpoints: 15 req/sec with burst buffer
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;

    # Sensitive endpoints (OTP generate/verify, login, registration): 3 req/sec
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/s;

    # Static assets zone: 40 req/sec
    limit_req_zone $binary_remote_addr zone=static_assets:10m rate=40r/s;

    # Connection limit per IP: prevents TCP connection exhaustion
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # Return HTTP 429 Too Many Requests when rate limit is exceeded
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool
    # --------------------------------------------------------------------------
    upstream prepmaster_backend {
        server prepmaster-app:8050 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Virtual Hosts Configuration
    # --------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
