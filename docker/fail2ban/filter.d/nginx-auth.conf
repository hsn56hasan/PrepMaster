# ==============================================================================
# Fail2ban Filter: Nginx / PrepMaster Auth & OTP Brute Force Protection
# Catches repeated 400/401/403 responses on /api/student/verify-otp & /api/auth/
# ==============================================================================

[Definition]
failregex = ^<HOST> - .* "(POST|GET) /api/student/(verify-otp|request-otp|verify).* HTTP/.*" (400|401|403) .*
            ^<HOST> - .* "(POST|GET) /api/auth/.* HTTP/.*" (400|401|403) .*
            ^{"time_local":.*"client_ip":"<HOST>".*"request":"POST /api/(student/(verify-otp|request-otp)|auth).*".*"status": "(400|401|403)".*}

ignoreregex =
