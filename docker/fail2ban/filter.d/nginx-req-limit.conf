# ==============================================================================
# Fail2ban Filter: Nginx Rate Limit Exceeded (HTTP 429 / zone triggers)
# ==============================================================================

[Definition]
failregex = limiting requests, excess:.* by zone ".*", client: <HOST>, server:
            ^<HOST> - .* "(GET|POST|HEAD|PUT|DELETE) .* HTTP/.*" 429 .*
            ^{"time_local":.*"client_ip":"<HOST>".*"status": "429".*}

ignoreregex =
