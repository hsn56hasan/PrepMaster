# ==============================================================================
# Fail2ban Filter: Malicious Bots, Scanners and Exploit Probes
# Catches 403 Forbidden or 404 probes for .env, .git, phpmyadmin, wp-login, etc.
# ==============================================================================

[Definition]
failregex = ^<HOST> - .* "(GET|POST|HEAD) .*\.(env|git|bak|sql|php|aspx|cgi).* HTTP/.*" (400|403|404) .*
            ^<HOST> - .* "(GET|POST|HEAD) .*(wp-login|phpmyadmin|pma|actuator|xmlrpc|solr).* HTTP/.*" (400|403|404) .*
            ^<HOST> - .* "(GET|POST|HEAD) .* HTTP/.*" 403 .* "(.*sqlmap|nikto|masscan|zgrab|nmap|acunetix|havij|nessus|gobuster|dirbuster).*"'

ignoreregex =
