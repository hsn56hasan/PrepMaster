# ==============================================================================
# PrepMaster Production Nginx Main Configuration (Docker Entrypoint Reference)
# Mirrors nginx/nginx.conf for modular builds and direct container mounting
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging with Cloudflare Real-IP awareness
    log_format cf_combined '$http_cf_connecting_ip - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'cf_ray="$http_cf_ray" country="$http_cf_ipcountry"';

    access_log  /var/log/nginx/access.log  cf_combined;

    # Cloudflare Real IP resolution
    include /etc/nginx/cloudflare_ips.conf;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    server_tokens   off;

    # Buffer Overflow & DoS Mitigations
    client_body_buffer_size      128k;
    client_max_body_size          25M;
    client_header_buffer_size     2k;
    large_client_header_buffers 4 8k;
    client_body_timeout           15s;
    client_header_timeout         15s;
    send_timeout                  15s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        font/otf
        font/ttf;
    gzip_disable "msie6";

    # Rate Limiting & Concurrent Connection Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=static_assets:10m rate=40r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # Upstream Backend Pool
    upstream prepmaster_backend {
        server prepmaster-app:8050 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Virtual Hosts
    include /etc/nginx/conf.d/*.conf;
}
